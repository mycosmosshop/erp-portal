<!DOCTYPE html>
<html lang="tr" data-theme="dark" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Sanifoam ERP Portal</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0d1117; --bg2:#090c10; --card:#161b22; --bg3:#121821;
  --border:#30363d; --text:#e6edf3; --muted:#8b949e;
  --primary:#1a237e; --blue:#0288d1; --cyan:#00bcd4;
  --green:#43a047; --orange:#fb8c00; --red:#e53935;
}
[data-theme="light"]{
  --bg:#f4f7fb; --bg2:#eaf0f8; --card:#ffffff; --bg3:#eef3fa;
  --border:#d5dde8; --text:#1e293b; --muted:#5b6b81;
  --primary:#0f2f6e; --blue:#0b79c9; --cyan:#0891b2;
  --green:#2e7d32; --orange:#ef6c00; --red:#d32f2f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;transition:background-color .2s,color .2s}

/* ── Sidebar ── */
.sidebar{width:248px;height:100vh;background:var(--bg2);border-right:1px solid var(--border);position:fixed;top:0;left:0;z-index:200;display:flex;flex-direction:column;overflow:hidden}
.sb-brand{display:flex;align-items:center;gap:.6rem;padding:1rem 1.1rem;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-brand img{height:30px;width:auto}
.sb-brand .t{font-weight:700;font-size:.95rem;line-height:1}
.sb-brand .s{font-size:.65rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sb-search{padding:.6rem .8rem;flex-shrink:0}
.sb-search input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.4rem .7rem;font-size:.82rem}
.sb-search input:focus{outline:none;border-color:var(--blue)}
.sb-nav{flex:1;overflow-y:auto;padding:.3rem 0}
.sb-cat{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:.7rem 1.1rem .3rem;font-weight:700}
.sb-link{display:flex;align-items:center;gap:.65rem;padding:.5rem 1.1rem;color:var(--muted);text-decoration:none;font-size:.86rem;border-left:3px solid transparent;cursor:pointer;transition:background .12s,color .12s}
.sb-link:hover{color:var(--text);background:rgba(127,127,127,.08)}
.sb-link.active{color:var(--text);background:rgba(127,127,127,.1);border-left-color:var(--blue)}
.sb-link i.ico{font-size:1.05rem;width:20px;text-align:center}
.sb-link .fav{margin-left:auto;font-size:.8rem;opacity:0;color:var(--orange)}
.sb-link:hover .fav{opacity:.5}
.sb-link .fav.on{opacity:1}
.sb-footer{padding:.6rem .8rem;border-top:1px solid var(--border);flex-shrink:0;display:flex;gap:.4rem}
.sb-footer button{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:.42rem;font-size:.9rem;cursor:pointer;transition:.12s}
.sb-footer button:hover{color:var(--text);border-color:var(--blue)}

/* ── Main ── */
.main{margin-left:248px;height:100vh;display:flex;flex-direction:column}
.topbar{height:52px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:.6rem;padding:0 1rem}
.topbar .title{font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:.55rem;min-width:0}
.topbar .title i{font-size:1.15rem}
.topbar .title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.tb-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:.38rem .7rem;font-size:.8rem;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;transition:.12s;white-space:nowrap}
.tb-btn:hover{color:var(--text);border-color:var(--blue)}
#mobileMenuBtn{display:none}

.content{flex:1;position:relative;overflow:hidden;background:var(--bg)}

/* ── Home ── */
#home{position:absolute;inset:0;overflow-y:auto;padding:1.6rem 1.8rem}
.home-hd{display:flex;align-items:baseline;gap:.6rem;margin-bottom:1.4rem}
.home-hd h1{font-size:1.4rem;font-weight:700}
.home-hd p{color:var(--muted);font-size:.86rem}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:1rem}
.mod-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.1rem;display:flex;flex-direction:column;gap:.5rem;transition:transform .14s,border-color .14s;position:relative}
.mod-card:hover{transform:translateY(-3px);border-color:var(--blue)}
.mod-card .ic{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#fff}
.mod-card h3{font-size:1rem;font-weight:600}
.mod-card p{font-size:.78rem;color:var(--muted);flex:1;line-height:1.45}
.mod-card .acts{display:flex;gap:.4rem;margin-top:.3rem}
.mod-card .acts .b{flex:1;text-align:center;border:1px solid var(--border);background:var(--bg3);color:var(--text);border-radius:8px;padding:.4rem;font-size:.8rem;cursor:pointer;text-decoration:none;transition:.12s}
.mod-card .acts .b.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.mod-card .acts .b:hover{filter:brightness(1.12)}
.mod-card .star{position:absolute;top:.7rem;right:.8rem;color:var(--muted);cursor:pointer;font-size:1rem}
.mod-card .star.on{color:var(--orange)}
.mod-card.disabled{opacity:.55}
.cat-title{grid-column:1/-1;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-top:.6rem}
.cat-title:first-child{margin-top:0}

/* ── Frames ── */
#frameHost{position:absolute;inset:0;display:none}
.frame-wrap{position:absolute;inset:0;display:none}
.frame-wrap.show{display:block}
.frame-wrap iframe{width:100%;height:100%;border:0;background:var(--bg)}
.frame-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;background:var(--bg);color:var(--muted);font-size:.85rem}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Manager ── */
.modal-content{background:var(--card);border:1px solid var(--border);color:var(--text)}
.modal-header,.modal-footer{border-color:var(--border)}
.form-control,.form-select{background:var(--bg3);border-color:var(--border);color:var(--text)}
.form-control:focus,.form-select:focus{background:var(--bg3);border-color:var(--blue);color:var(--text);box-shadow:0 0 0 .2rem rgba(2,136,209,.18)}
.form-label{font-size:.78rem;color:var(--muted);margin-bottom:.25rem;font-weight:600}
.mgr-row{display:grid;grid-template-columns:30px 34px 1fr auto;align-items:center;gap:.7rem;padding:.55rem .3rem;border-bottom:1px solid var(--border)}
.mgr-row .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.95rem}
.mgr-row .nm{font-size:.86rem;font-weight:600}
.mgr-row .sub{font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.mgr-row .ord{display:flex;flex-direction:column;gap:1px}
.mgr-row .ord button{background:none;border:0;color:var(--muted);cursor:pointer;line-height:.8;padding:0}
.mgr-row .ord button:hover{color:var(--text)}
.mgr-act{display:flex;gap:.35rem}
.mgr-act button{background:var(--bg3);border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:.25rem .5rem;font-size:.78rem;cursor:pointer}
.mgr-act button:hover{color:var(--text);border-color:var(--blue)}
.form-switch .form-check-input{cursor:pointer}
.icon-pick{display:flex;align-items:center;gap:.5rem}
.icon-pick .prev{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;flex-shrink:0}

/* ── Mobile ── */
#sidebarBackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:190}
@media(max-width:860px){
  .sidebar{transform:translateX(-100%);transition:transform .25s ease}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  #mobileMenuBtn{display:inline-flex}
  #sidebarBackdrop.show{display:block}
  .topbar .tb-btn .lbl{display:none}
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>

<div id="sidebarBackdrop" onclick="toggleSidebar()"></div>

<!-- ════ SIDEBAR ════ -->
<nav class="sidebar" id="sidebar">
  <div class="sb-brand">
    <img src="SanifoamLogo-Transparent.png" alt="logo" onerror="this.style.display='none'">
    <div><div class="t">ERP Portal</div><div class="s">Sanifoam</div></div>
  </div>
  <div class="sb-search">
    <input id="searchBox" type="text" placeholder="🔍 Modül ara..." oninput="renderSidebar();renderHome()">
  </div>
  <div class="sb-nav" id="sbNav"></div>
  <div class="sb-footer">
    <button onclick="goHome()" title="Ana ekran"><i class="bi bi-grid-1x2-fill"></i></button>
    <button onclick="cycleRole()" id="roleBtn" title="Profil / Rol"><i class="bi bi-person-circle"></i></button>
    <button onclick="toggleTheme()" id="themeBtn" title="Tema"><i class="bi bi-moon-stars-fill"></i></button>
    <button onclick="openManager()" title="Modül Yönetimi"><i class="bi bi-gear-fill"></i></button>
  </div>
</nav>

<!-- ════ MAIN ════ -->
<div class="main">
  <div class="topbar">
    <button id="mobileMenuBtn" class="tb-btn" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
    <div class="title" id="tbTitle"><i class="bi bi-grid-1x2-fill"></i><span>Ana Ekran</span></div>
    <div class="sp"></div>
    <button class="tb-btn" id="tbReload" onclick="reloadCurrent()" style="display:none"><i class="bi bi-arrow-clockwise"></i><span class="lbl">Yenile</span></button>
    <a class="tb-btn" id="tbNew" href="#" target="_blank" rel="noopener" style="display:none"><i class="bi bi-box-arrow-up-right"></i><span class="lbl">Yeni Sekme</span></a>
    <button class="tb-btn" id="tbFull" onclick="fullscreenCurrent()" style="display:none"><i class="bi bi-arrows-fullscreen"></i></button>
  </div>
  <div class="content">
    <!-- Home -->
    <div id="home"></div>
    <!-- iframe host -->
    <div id="frameHost"></div>
  </div>
</div>

<!-- ════ MANAGER MODAL ════ -->
<div class="modal fade" id="mgrModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-gear-fill me-2"></i>Modül Yönetimi</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex flex-wrap gap-2 mb-3">
          <button class="btn btn-sm btn-primary" onclick="editModule(null)"><i class="bi bi-plus-lg me-1"></i>Yeni Modül</button>
          <button class="btn btn-sm btn-outline-secondary" onclick="exportConfig()"><i class="bi bi-download me-1"></i>Dışa Aktar (JSON)</button>
          <label class="btn btn-sm btn-outline-secondary mb-0"><i class="bi bi-upload me-1"></i>İçe Aktar<input type="file" accept=".json" hidden onchange="importConfig(event)"></label>
          <button class="btn btn-sm btn-outline-danger ms-auto" onclick="resetConfig()"><i class="bi bi-arrow-counterclockwise me-1"></i>Varsayılana Dön</button>
        </div>
        <div id="mgrList"></div>
      </div>
    </div>
  </div>
</div>

<!-- ════ EDIT MODULE MODAL ════ -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editTitle">Modül</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="fId">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Modül Adı *</label>
            <input class="form-control" id="fAd" placeholder="Örn. Kalibrasyon Takip">
          </div>
          <div class="col-12">
            <label class="form-label">Açıklama</label>
            <input class="form-control" id="fAciklama" placeholder="Kısa açıklama">
          </div>
          <div class="col-12">
            <label class="form-label">Adres (URL veya dosya yolu) *</label>
            <input class="form-control" id="fKaynak" placeholder="https://... ya da klasor/index.html">
          </div>
          <div class="col-6">
            <label class="form-label">Kategori</label>
            <input class="form-control" id="fKategori" list="catList" placeholder="Kalite">
            <datalist id="catList"></datalist>
          </div>
          <div class="col-6">
            <label class="form-label">İkon (Bootstrap Icons)</label>
            <div class="icon-pick">
              <div class="prev" id="fIconPrev" style="background:var(--blue)"><i class="bi bi-box"></i></div>
              <input class="form-control" id="fIkon" value="bi-box" oninput="updateIconPrev()" placeholder="bi-box">
            </div>
            <div style="font-size:.68rem;color:var(--muted);margin-top:.25rem">İkon kodları: icons.getbootstrap.com</div>
          </div>
          <div class="col-6">
            <label class="form-label">Renk</label>
            <input type="color" class="form-control form-control-color" id="fRenk" value="#0288d1" oninput="updateIconPrev()" style="width:100%;height:38px">
          </div>
          <div class="col-6">
            <label class="form-label">Görünür Roller</label>
            <input class="form-control" id="fRoller" value="*" placeholder="* veya admin,kalite">
            <div style="font-size:.68rem;color:var(--muted);margin-top:.25rem">* = herkes</div>
          </div>
          <div class="col-12 d-flex gap-4 mt-2">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="fAktif" checked>
              <label class="form-check-label" for="fAktif">Aktif</label>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="fYeniSekme">
              <label class="form-check-label" for="fYeniSekme">Her zaman yeni sekmede aç</label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">İptal</button>
        <button class="btn btn-primary" onclick="saveEdit()">Kaydet</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script>
// ══════════════════════════════════════════════════════════════
//  VARSAYILAN MODÜLLER (tohum)  —  arayüzden düzenlenebilir
//  Yeni modül eklemek için en pratik yol: Sidebar > ⚙ > Yeni Modül
//  Buraya eklenen yeni varsayılanlar, mevcut kullanıcılarda da
//  (silmedikleri sürece) otomatik görünür.
// ══════════════════════════════════════════════════════════════
const DEFAULT_MODULES = [
  { id:'bakim', ad:'Bakım Yönetim Sistemi', aciklama:'CMMS — makineler, arızalar, planlı bakım, iş emirleri, OEE, raporlar.',
    ikon:'bi-tools', renk:'#0288d1', kategori:'Bakım', kaynak:'https://mycosmosshop.github.io/bakim-yonetim-sistemi/bakim_yonetim_sistemi.html', roller:['*'], yeniSekme:false, aktif:true },

  { id:'pfmea', ad:'AIAG-VDA PFMEA', aciklama:'Süreç FMEA hazırlama ve risk değerlendirme yazılımı.',
    ikon:'bi-diagram-3-fill', renk:'#fb8c00', kategori:'Kalite', kaynak:'https://mycosmosshop.github.io/pfmea/', roller:['*'], yeniSekme:false, aktif:true },

  { id:'tedarikci', ad:'Onaylı Tedarikçi Değerlendirme', aciklama:'Tedarikçi listesi, değerlendirme ve onay süreçleri.',
    ikon:'bi-people-fill', renk:'#43a047', kategori:'Tedarik', kaynak:'https://mycosmosshop.github.io/supplier-system/', roller:['*'], yeniSekme:false, aktif:true },

  { id:'coa', ad:'COA Arşiv', aciklama:'Analiz sertifikası (CoA) arşivi ve sorgulama.',
    ikon:'bi-archive-fill', renk:'#00bcd4', kategori:'Tedarik', kaynak:'https://mycosmosshop.github.io/supplier-system/coa-arsiv.html', roller:['*'], yeniSekme:false, aktif:true },

  { id:'uygunsuzluk', ad:'Uygunsuzluk Analizi', aciklama:'Tedarikçi uygunsuzluk kayıtları ve analizi.',
    ikon:'bi-exclamation-triangle-fill', renk:'#e53935', kategori:'Kalite', kaynak:'https://mycosmosshop.github.io/supplier-system/uygunsuzluk-analizi.html', roller:['*'], yeniSekme:false, aktif:true },

  { id:'balikkilcigi', ad:'Balık Kılçığı (Ishikawa)', aciklama:'Kök neden analizi — balık kılçığı diyagramı.',
    ikon:'bi-diagram-2-fill', renk:'#8e24aa', kategori:'Kalite', kaynak:'https://mycosmosshop.github.io/supplier-system/balik-kilcigi.html', roller:['*'], yeniSekme:false, aktif:true },

  { id:'besneden', ad:'5 Neden Analizi', aciklama:'Kök neden analizi — 5 Neden (5 Why) yöntemi.',
    ikon:'bi-question-circle-fill', renk:'#9c27b0', kategori:'Kalite', kaynak:'https://mycosmosshop.github.io/supplier-system/5-neden-analizi.html', roller:['*'], yeniSekme:false, aktif:true },

  { id:'rapor8d', ad:'8D Raporlar', aciklama:'8D problem çözme raporları.',
    ikon:'bi-clipboard-data-fill', renk:'#1e88e5', kategori:'Kalite', kaynak:'https://mycosmosshop.github.io/supplier-system/8d-rapor.html', roller:['*'], yeniSekme:false, aktif:true },

  { id:'dof', ad:'DÖF Yönetimi', aciklama:'Düzeltici/önleyici faaliyet (DÖF/CAPA) yönetimi.',
    ikon:'bi-folder-fill', renk:'#00897b', kategori:'Kalite', kaynak:'https://mycosmosshop.github.io/supplier-system/dof-yonetimi.html', roller:['*'], yeniSekme:false, aktif:true },

  { id:'kalibrasyon', ad:'Kalibrasyon Takip', aciklama:'Ekipman kalibrasyon periyotları, sertifikalar, sonraki tarih takibi.',
    ikon:'bi-rulers', renk:'#26c6da', kategori:'Bakım', kaynak:'https://mycosmosshop.github.io/kalibrasyon/', roller:['*'], yeniSekme:false, aktif:true },

  { id:'kalitekontrol', ad:'Kalite Kontrol', aciklama:'Seri başı / proses / son kontrol kayıt sistemi.',
    ikon:'bi-clipboard2-check-fill', renk:'#66bb6a', kategori:'Kalite', kaynak:'https://mycosmosshop.github.io/kalite-kontrol/', roller:['*'], yeniSekme:false, aktif:true },

  { id:'teknikresim', ad:'Teknik Resim Balonlama', aciklama:'Teknik resim balonlama / ölçü çıkarma (OCR).',
    ikon:'bi-vector-pen', renk:'#ab47bc', kategori:'Araçlar', kaynak:'https://mycosmosshop.github.io/teknik-resim/', roller:['*'], yeniSekme:false, aktif:true },
];

const ROLES = ['admin','kalite','bakim','teknisyen','tedarik','misafir'];
const LS_MODS='erp_portal_modules', LS_DEL='erp_portal_deleted', LS_THEME='erp_portal_theme',
      LS_ROLE='erp_portal_role', LS_FAVS='erp_portal_favs';

let modules=[], currentId=null, role='admin', favs=[];

// ── Yükleme / kaydetme (varsayılan birleştirme ile) ──
function loadModules(){
  let saved=null, del=[];
  try{ saved=JSON.parse(localStorage.getItem(LS_MODS)||'null'); }catch(e){}
  try{ del=JSON.parse(localStorage.getItem(LS_DEL)||'[]'); }catch(e){}
  if(!Array.isArray(saved)){
    modules=DEFAULT_MODULES.map(m=>({...m}));
  }else{
    // Kayıtlı listeyi al; YERLEŞİK modüllerin kod-kontrollü alanlarını (adres/görsel) koddan tazele.
    // Kullanıcı tercihleri (aç/kapa, sıra, favori) korunur. Panelden elle düzenlenenler (_custom) dokunulmaz.
    modules=saved.map(m=>{
      const d=DEFAULT_MODULES.find(x=>x.id===m.id);
      if(d && !m._custom){
        return {...m, kaynak:d.kaynak, ad:d.ad, aciklama:d.aciklama, ikon:d.ikon, renk:d.renk, kategori:d.kategori, roller:d.roller};
      }
      return {...m};
    });
    // Kodda eklenen YENİ varsayılanları (kullanıcı silmediyse) sona ekle
    const have=new Set(modules.map(m=>m.id));
    DEFAULT_MODULES.forEach(d=>{ if(!have.has(d.id) && !del.includes(d.id)) modules.push({...d}); });
    saveModules();
  }
}
function saveModules(){ localStorage.setItem(LS_MODS, JSON.stringify(modules)); }
function markDeleted(id){
  if(!DEFAULT_MODULES.some(d=>d.id===id)) return;
  let del=[]; try{ del=JSON.parse(localStorage.getItem(LS_DEL)||'[]'); }catch(e){}
  if(!del.includes(id)){ del.push(id); localStorage.setItem(LS_DEL, JSON.stringify(del)); }
}

// ── Görünürlük (rol + arama + aktif) ──
function visibleFor(m){
  if(!m.aktif) return false;
  if(role==='admin') return true;
  return (m.roller||['*']).includes('*') || (m.roller||[]).includes(role);
}
function matchSearch(m){
  const q=(document.getElementById('searchBox').value||'').toLowerCase().trim();
  if(!q) return true;
  return (m.ad+' '+(m.aciklama||'')+' '+(m.kategori||'')).toLowerCase().includes(q);
}

// ── Sidebar ──
function renderSidebar(){
  const nav=document.getElementById('sbNav');
  const list=modules.filter(m=>visibleFor(m)&&matchSearch(m));
  const cats={};
  list.forEach(m=>{ const c=m.kategori||'Diğer'; (cats[c]=cats[c]||[]).push(m); });
  let html='';
  // Favoriler
  const favList=list.filter(m=>favs.includes(m.id));
  if(favList.length){
    html+='<div class="sb-cat">⭐ Favoriler</div>';
    favList.forEach(m=>html+=linkHtml(m));
  }
  Object.keys(cats).sort().forEach(c=>{
    html+=`<div class="sb-cat">${c}</div>`;
    cats[c].forEach(m=>html+=linkHtml(m));
  });
  if(!list.length) html='<div class="sb-cat">Sonuç yok</div>';
  nav.innerHTML=html;
}
function linkHtml(m){
  const on=favs.includes(m.id)?'on':'';
  return `<a class="sb-link ${currentId===m.id?'active':''}" onclick="launch('${m.id}')">
    <i class="bi ${m.ikon} ico" style="color:${m.renk}"></i>
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.ad}</span>
    <i class="bi bi-star-fill fav ${on}" onclick="event.stopPropagation();toggleFav('${m.id}')"></i>
  </a>`;
}

// ── Home ──
function renderHome(){
  const home=document.getElementById('home');
  const list=modules.filter(m=>matchSearch(m)).filter(m=>role==='admin'||visibleFor(m)||!m.aktif?true:true);
  const visList=modules.filter(m=> (role==='admin'? true : visibleFor(m)||!m.aktif) && matchSearch(m));
  const cats={};
  visList.forEach(m=>{ const c=m.kategori||'Diğer'; (cats[c]=cats[c]||[]).push(m); });
  let html=`<div class="home-hd"><h1>Uygulamalar</h1><p>${visList.filter(m=>m.aktif).length} aktif modül · profil: <b>${role}</b></p></div><div class="card-grid">`;
  Object.keys(cats).sort().forEach(c=>{
    html+=`<div class="cat-title">${c}</div>`;
    cats[c].forEach(m=>{
      const disabled=!m.aktif||!m.kaynak;
      const star=favs.includes(m.id)?'on':'';
      html+=`<div class="mod-card ${disabled?'disabled':''}">
        <i class="bi bi-star-fill star ${star}" onclick="toggleFav('${m.id}')" title="Favori"></i>
        <div class="ic" style="background:${m.renk}"><i class="bi ${m.ikon}"></i></div>
        <h3>${m.ad}</h3>
        <p>${m.aciklama||''}</p>
        <div class="acts">
          ${disabled
            ? `<span class="b" style="opacity:.6;cursor:default">${m.kaynak?'Pasif':'Adres yok'}</span>`
            : `<span class="b primary" onclick="launch('${m.id}')"><i class="bi bi-play-fill"></i> Aç</span>
               <a class="b" href="${m.kaynak}" target="_blank" rel="noopener" title="Yeni sekme"><i class="bi bi-box-arrow-up-right"></i></a>`}
        </div>
      </div>`;
    });
  });
  html+='</div>';
  home.innerHTML=html;
}

// ── Modül açma (iframe keep-alive) ──
function launch(id){
  const m=modules.find(x=>x.id===id); if(!m||!m.kaynak) return;
  closeMobile();
  if(m.yeniSekme){ window.open(m.kaynak,'_blank','noopener'); return; }
  currentId=id;
  document.getElementById('home').style.display='none';
  document.getElementById('frameHost').style.display='block';
  // mevcut frame var mı?
  let wrap=document.querySelector(`.frame-wrap[data-mid="${id}"]`);
  if(!wrap){
    wrap=document.createElement('div');
    wrap.className='frame-wrap';
    wrap.dataset.mid=id;
    wrap.innerHTML=`<div class="frame-loading"><div class="spinner"></div><div>${m.ad} yükleniyor…</div></div>`;
    const ifr=document.createElement('iframe');
    ifr.src=m.kaynak;
    ifr.addEventListener('load',()=>{ const l=wrap.querySelector('.frame-loading'); if(l) l.remove(); });
    wrap.appendChild(ifr);
    document.getElementById('frameHost').appendChild(wrap);
  }
  document.querySelectorAll('.frame-wrap').forEach(w=>w.classList.remove('show'));
  wrap.classList.add('show');
  // topbar
  const t=document.getElementById('tbTitle');
  t.innerHTML=`<i class="bi ${m.ikon}" style="color:${m.renk}"></i><span>${m.ad}</span>`;
  document.getElementById('tbReload').style.display='';
  document.getElementById('tbFull').style.display='';
  const nw=document.getElementById('tbNew'); nw.style.display=''; nw.href=m.kaynak;
  renderSidebar();
}
function goHome(){
  currentId=null;
  document.querySelectorAll('.frame-wrap').forEach(w=>w.classList.remove('show'));
  document.getElementById('frameHost').style.display='none';
  document.getElementById('home').style.display='';
  document.getElementById('tbTitle').innerHTML='<i class="bi bi-grid-1x2-fill"></i><span>Ana Ekran</span>';
  ['tbReload','tbNew','tbFull'].forEach(i=>document.getElementById(i).style.display='none');
  closeMobile(); renderSidebar();
}
function reloadCurrent(){
  const wrap=document.querySelector(`.frame-wrap[data-mid="${currentId}"]`);
  if(wrap){ const ifr=wrap.querySelector('iframe'); const src=ifr.src;
    if(!wrap.querySelector('.frame-loading')){ const m=modules.find(x=>x.id===currentId);
      const l=document.createElement('div'); l.className='frame-loading';
      l.innerHTML=`<div class="spinner"></div><div>${m.ad} yenileniyor…</div>`; wrap.appendChild(l);
      ifr.addEventListener('load',()=>l.remove(),{once:true}); }
    ifr.src=src; }
}
function fullscreenCurrent(){
  const wrap=document.querySelector(`.frame-wrap[data-mid="${currentId}"]`);
  const ifr=wrap&&wrap.querySelector('iframe');
  if(ifr&&ifr.requestFullscreen) ifr.requestFullscreen();
}

// ── Favoriler ──
function toggleFav(id){
  const i=favs.indexOf(id);
  if(i>=0) favs.splice(i,1); else favs.push(id);
  localStorage.setItem(LS_FAVS, JSON.stringify(favs));
  renderSidebar(); renderHome();
}

// ── Tema / Rol / Mobil ──
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const nx=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',nx);
  document.documentElement.setAttribute('data-bs-theme',nx);
  document.getElementById('themeBtn').innerHTML=`<i class="bi ${nx==='dark'?'bi-moon-stars-fill':'bi-sun-fill'}"></i>`;
  localStorage.setItem(LS_THEME,nx);
}
function cycleRole(){
  const i=ROLES.indexOf(role);
  role=ROLES[(i+1)%ROLES.length];
  localStorage.setItem(LS_ROLE,role);
  document.getElementById('roleBtn').title='Profil: '+role;
  renderSidebar(); renderHome();
}
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('show');
}
function closeMobile(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
}

let _mgrModal,_editModal;
function openManager(){ closeMobile(); renderManager(); _mgrModal.show(); }
function renderManager(){
  const el=document.getElementById('mgrList');
  el.innerHTML=modules.map((m,i)=>`
    <div class="mgr-row">
      <div class="ord">
        <button onclick="moveModule(${i},-1)" ${i===0?'disabled style=opacity:.3':''}><i class="bi bi-caret-up-fill"></i></button>
        <button onclick="moveModule(${i},1)" ${i===modules.length-1?'disabled style=opacity:.3':''}><i class="bi bi-caret-down-fill"></i></button>
      </div>
      <div class="ic" style="background:${m.renk}"><i class="bi ${m.ikon}"></i></div>
      <div style="min-width:0">
        <div class="nm">${m.ad} ${m.aktif?'':'<span style="color:var(--muted);font-weight:400">(pasif)</span>'}</div>
        <div class="sub">${m.kaynak||'— adres yok —'} · ${m.kategori||'Diğer'}</div>
      </div>
      <div class="mgr-act">
        <div class="form-check form-switch m-0 d-flex align-items-center">
          <input class="form-check-input" type="checkbox" ${m.aktif?'checked':''} onchange="toggleActive('${m.id}')">
        </div>
        <button onclick="editModule('${m.id}')" title="Düzenle"><i class="bi bi-pencil"></i></button>
        <button onclick="deleteModule('${m.id}')" title="Sil"><i class="bi bi-trash"></i></button>
      </div>
    </div>`).join('');
}
function moveModule(i,dir){
  const j=i+dir; if(j<0||j>=modules.length) return;
  [modules[i],modules[j]]=[modules[j],modules[i]];
  saveModules(); renderManager(); renderSidebar(); renderHome();
}
function toggleActive(id){
  const m=modules.find(x=>x.id===id); m.aktif=!m.aktif;
  saveModules(); renderManager(); renderSidebar(); renderHome();
}
function deleteModule(id){
  const m=modules.find(x=>x.id===id);
  if(!confirm(`"${m.ad}" modülü kaldırılsın mı?`)) return;
  modules=modules.filter(x=>x.id!==id);
  markDeleted(id); saveModules(); renderManager(); renderSidebar(); renderHome();
  if(currentId===id) goHome();
}
function editModule(id){
  const m=id?modules.find(x=>x.id===id):null;
  document.getElementById('editTitle').textContent=m?'Modülü Düzenle':'Yeni Modül';
  document.getElementById('fId').value=m?m.id:'';
  document.getElementById('fAd').value=m?m.ad:'';
  document.getElementById('fAciklama').value=m?(m.aciklama||''):'';
  document.getElementById('fKaynak').value=m?(m.kaynak||''):'';
  document.getElementById('fKategori').value=m?(m.kategori||''):'';
  document.getElementById('fIkon').value=m?m.ikon:'bi-box';
  document.getElementById('fRenk').value=m?m.renk:'#0288d1';
  document.getElementById('fRoller').value=m?(m.roller||['*']).join(','):'*';
  document.getElementById('fAktif').checked=m?m.aktif:true;
  document.getElementById('fYeniSekme').checked=m?!!m.yeniSekme:false;
  // kategori önerileri
  document.getElementById('catList').innerHTML=[...new Set(modules.map(x=>x.kategori).filter(Boolean))].map(c=>`<option value="${c}">`).join('');
  updateIconPrev();
  _editModal.show();
}
function updateIconPrev(){
  const p=document.getElementById('fIconPrev');
  p.style.background=document.getElementById('fRenk').value;
  let ik=document.getElementById('fIkon').value.trim()||'bi-box';
  if(!ik.startsWith('bi-')) ik='bi-'+ik;
  p.innerHTML=`<i class="bi ${ik}"></i>`;
}
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,40)||('m'+modules.length); }
function saveEdit(){
  const ad=document.getElementById('fAd').value.trim();
  if(!ad){ alert('Modül adı gerekli.'); return; }
  let ik=document.getElementById('fIkon').value.trim()||'bi-box'; if(!ik.startsWith('bi-')) ik='bi-'+ik;
  const roller=document.getElementById('fRoller').value.split(',').map(s=>s.trim()).filter(Boolean);
  const obj={
    ad, aciklama:document.getElementById('fAciklama').value.trim(),
    kaynak:document.getElementById('fKaynak').value.trim(),
    kategori:document.getElementById('fKategori').value.trim()||'Diğer',
    ikon:ik, renk:document.getElementById('fRenk').value,
    roller:roller.length?roller:['*'],
    aktif:document.getElementById('fAktif').checked,
    yeniSekme:document.getElementById('fYeniSekme').checked
  };
  const id=document.getElementById('fId').value;
  if(id){ const m=modules.find(x=>x.id===id); Object.assign(m,obj); m._custom=true; }
  else { obj.id=slugify(ad); if(modules.some(x=>x.id===obj.id)) obj.id+='-'+Date.now().toString(36); modules.push(obj); }
  saveModules(); _editModal.hide(); renderManager(); renderSidebar(); renderHome();
}

// ── Dışa/İçe aktar ──
function exportConfig(){
  const blob=new Blob([JSON.stringify(modules,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='erp-portal-moduller.json'; a.click(); URL.revokeObjectURL(a.href);
}
function importConfig(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const arr=JSON.parse(r.result);
    if(!Array.isArray(arr)) throw 0;
    if(!confirm('Mevcut modül listesi içe aktarılan dosyayla değiştirilsin mi?')) return;
    modules=arr; saveModules(); renderManager(); renderSidebar(); renderHome();
    alert('İçe aktarıldı: '+arr.length+' modül.');
  }catch(e){ alert('Geçersiz JSON dosyası.'); } };
  r.readAsText(f); ev.target.value='';
}
function resetConfig(){
  if(!confirm('Tüm değişiklikler silinip varsayılan modüllere dönülsün mü?')) return;
  localStorage.removeItem(LS_MODS); localStorage.removeItem(LS_DEL);
  loadModules(); saveModules(); renderManager(); renderSidebar(); renderHome();
}

// ── Portal başlat (giriş onaylandıktan sonra çağrılır) ──
function bootPortal(){
  const th=localStorage.getItem(LS_THEME)||'dark';
  document.documentElement.setAttribute('data-theme',th);
  document.documentElement.setAttribute('data-bs-theme',th);
  document.getElementById('themeBtn').innerHTML=`<i class="bi ${th==='dark'?'bi-moon-stars-fill':'bi-sun-fill'}"></i>`;
  role=localStorage.getItem(LS_ROLE)||'admin';
  document.getElementById('roleBtn').title='Profil: '+role;
  try{ favs=JSON.parse(localStorage.getItem(LS_FAVS)||'[]'); }catch(e){ favs=[]; }
  loadModules();
  _mgrModal=new bootstrap.Modal(document.getElementById('mgrModal'));
  _editModal=new bootstrap.Modal(document.getElementById('editModal'));
  renderSidebar(); renderHome();
}

    (pend.length?pend.map(r=>rowHtml(r,false)).join(''):'<div style="color:var(--muted);font-size:.82rem;margin:.3rem 0 .6rem">Bekleyen yok</div>')+
    `<div class="sb-cat" style="padding-left:0;margin-top:1rem">✅ Onaylılar (${appr.length})</div>`+
    appr.map(r=>rowHtml(r,true)).join('');
}
async function setApprove(id,val){
  const {error}=await _sb.from('erp_users').update({approved:val}).eq('id',id);
  if(error){ alert('Hata: '+error.message); return; }
  renderApprovals();
}
window.openApprovals=openApprovals; window.setApprove=setApprove;

// ── Açılış: önce giriş kapısı ──
(async function(){
  document.body.insertAdjacentHTML('beforeend', _gateHtml());
  if(!(window.supabase && window.supabase.createClient)){ _authMsg('Supabase yüklenemedi (internet?).',true); return; }
  _sb = window.supabase.createClient(ERP_SB_URL, ERP_SB_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
  try{
    const {data:{session}}=await _sb.auth.getSession();
    if(session) await afterAuth(); else _showLogin();
  }catch(e){ _showLogin(); }
})();
</script>
