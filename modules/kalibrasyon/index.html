<body class="bg-slate-100 dark:bg-slate-900">
    <div id="root"></div>
    <script>
      (async () => {
        'use strict';
        // --- Gelişmiş Service Worker Kayıt Mantığı ---
        
        // 1. Tarayıcı desteğini kontrol et.
        if (!('serviceWorker' in navigator)) {
          console.log('Service Worker bu tarayıcı tarafından desteklenmiyor.');
          return;
        }

        // 2. SW'nin devre dışı bırakılacağı ortamları belirle.
        const isLocalhost = ['localhost', '127.0.0.1'].includes(location.hostname);
        if (location.protocol === 'file:' || (location.protocol === 'http:' && !isLocalhost)) {
          console.warn('Service Worker bu ortam için devre dışı bırakıldı (file protocol veya localhost olmayan http).');
          window.__SW_DISABLED__ = true;
          return;
        }
        
        try {
          // 3. Çakışmaları önlemek için farklı kökenlerden (origin) gelen eski SW'leri kaldır.
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            if (registration.active) {
              try {
                const scriptURL = new URL(registration.active.scriptURL);
                if (scriptURL.origin !== location.origin) {
                  console.log('Farklı kökenden gelen eski service worker kaydı siliniyor:', scriptURL.origin);
                  await registration.unregister();
                }
              } catch (e) {
                 console.warn('Eski bir kayıt için scriptURL ayrıştırılamadı, silme işlemi atlanıyor.', e);
              }
            }
          }

          // 4. Yeni service worker'ı kaydet.
          const swUrl = new URL('sw.js', location.origin);
          const reg = await navigator.serviceWorker.register(swUrl);
          
          // Kayıt nesnesini, uygulamanın kullanabilmesi için global olarak erişilebilir yap.
          window.__SW_REGISTRATION__ = reg;
          
          // 5. Güncellemeleri dinle.
          reg.onupdatefound = () => {
            const installingWorker = reg.installing;
            if (installingWorker) {
              installingWorker.onstatechange = () => {
                // Yeni worker yüklendiğinde ve sayfayı kontrol eden eski bir worker varsa...
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('Yeni bir sürüm mevcut. Güncellemeye hazır.');
                  // React uygulamasının "Güncelle" butonu göstermesi için global bir işaret ayarla.
                  window.__SW_HAS_UPDATE__ = true;
                }
              };
            }
          };
        } catch (error) {
          console.warn('Service Worker kaydı başarısız oldu:', error);
        }
      })();
    </script>
